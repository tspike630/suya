<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <title>粟牙</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23f2e2b8' d='M8 1 9.2 6.2 14.5 7.2 9.2 8.4 8 14 6.8 8.4 1.5 7.2 6.8 6.2Z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/suya.css?v=8" />
  </head>
  <body>
    <div id="shell" data-scene="title" data-rain="soft">
      <canvas id="sky" aria-hidden="true"></canvas>
      <div class="rain" aria-hidden="true"></div>
      <header id="top">
        <div class="brand">粟牙</div>
        <div id="where"></div>
        <button type="button" id="sound-btn" data-action="mute" hidden>声音</button>
        <button type="button" id="menu-btn" data-action="menu" hidden><img src="assets/ui/set.png" alt="菜单" /></button>
      </header>
      <main id="view">
        <section class="title-screen">
          <img class="frame-side left" src="assets/ui/side-left.png" alt="" />
          <img class="frame-side right" src="assets/ui/side-right.png" alt="" />
          <img class="title-clock" src="assets/ui/clock.png" alt="" />
          <img class="title-star s1" src="assets/ui/star.png" alt="" />
          <img class="title-star s2" src="assets/ui/star3.png" alt="" />
          <img class="title-star s3" src="assets/ui/star4.png" alt="" />
          <div class="cast" aria-hidden="true">
            <img src="assets/characters/xuelan.png" alt="" />
            <img class="lead" src="assets/characters/suya.png" alt="" />
            <img src="assets/characters/yuling.png" alt="" />
          </div>
          <div class="title-copy">
            <p class="eyebrow">作品 / 主人公</p>
            <h1><span>粟</span><i aria-hidden="true"></i><span>牙</span></h1>
            <p class="tag">物理教师 · 八尺戒尺 · 抽不完的和天下</p>
            <button type="button" class="tap" data-action="start"><img src="assets/ui/tap.png" alt="按下任意键开始" /></button>
            <div class="title-actions">
              <button type="button" class="ui-pill" id="continue-btn" data-action="continue" hidden>继续</button>
            </div>
          </div>
        </section>
      </main>
      <nav id="dock" aria-label="可调查的事物" hidden></nav>
      <div id="layer" hidden>
        <button type="button" id="catcher" data-action="advance" aria-label="继续"></button>
        <div id="panel"></div>
      </div>
      <p id="toast" hidden></p>
    </div>

    <template id="tpl-title">
      <section class="title-screen">
        <img class="frame-side left" src="assets/ui/side-left.png" alt="" />
        <img class="frame-side right" src="assets/ui/side-right.png" alt="" />
        <img class="title-clock" src="assets/ui/clock.png" alt="" />
        <img class="title-star s1" src="assets/ui/star.png" alt="" />
        <img class="title-star s2" src="assets/ui/star3.png" alt="" />
        <img class="title-star s3" src="assets/ui/star4.png" alt="" />
        <div class="cast" aria-hidden="true">
          <img src="assets/characters/xuelan.png" alt="" />
          <img class="lead" src="assets/characters/suya.png" alt="" />
          <img src="assets/characters/yuling.png" alt="" />
        </div>
        <div class="title-copy">
          <p class="eyebrow">作品 / 主人公</p>
          <h1><span>粟</span><i aria-hidden="true"></i><span>牙</span></h1>
          <p class="tag">物理教师 · 八尺戒尺 · 抽不完的和天下</p>
          <button type="button" class="tap" data-action="start"><img src="assets/ui/tap.png" alt="按下任意键开始" /></button>
          <div class="title-actions">
              <button type="button" class="ui-pill" id="continue-btn" data-action="continue" hidden>继续</button>
          </div>
        </div>
      </section>
    </template>

    <template id="tpl-ward">
      <div class="scene scene-ward">
        <div class="stage-bg"></div>
        <img class="cast-fig ward-xue" src="assets/characters/xuelan.png" alt="雪兰" data-who="雪兰" />
        <img class="cast-fig ward-yu" src="assets/characters/yuling.png" alt="域零" data-who="域零" data-spot="yuling" />
        <img class="cast-fig ward-su" src="assets/characters/suya.png" alt="粟牙" data-who="粟牙" data-spot="kit" />
        <div class="spots"></div>
      </div>
    </template>

    <template id="tpl-corridor">
      <div class="scene scene-hall">
        <div class="stage-bg"></div>
        <div class="painting"><div class="slit"></div></div>
        <img class="cast-fig hall-su" src="assets/characters/suya.png" alt="粟牙" data-who="粟牙" data-spot="kit" />
        <div class="spots"></div>
      </div>
    </template>

    <template id="tpl-yard">
      <div class="scene scene-yard">
        <div class="stage-bg"></div>
        <img class="cast-fig yard-lin" src="assets/characters/linju.png" alt="林桔" data-who="林桔" data-spot="linju" />
        <img class="cast-fig yard-yu" src="assets/characters/yuling.png" alt="域零" data-who="域零" data-spot="yuling-yard" />
        <img class="cast-fig yard-su" src="assets/characters/suya.png" alt="粟牙" data-who="粟牙" data-spot="kit" />
        <div class="spots"></div>
      </div>
    </template>

    <template id="tpl-star">
      <div class="scene scene-star">
        <div class="stage-bg"></div>
        <img class="cast-fig star-yu" src="assets/characters/yuling.png" alt="域零" data-who="域零" data-spot="yushit" />
        <img class="cast-fig star-xue" src="assets/characters/xuelan.png" alt="雪兰" data-who="雪兰" data-spot="yustar5" />
        <img class="cast-fig star-xi" src="assets/characters/xi.png" alt="兮" data-who="兮" data-spot="xstar" />
        <img class="cast-fig star-su" src="assets/characters/suya.png" alt="粟牙" data-who="粟牙" data-spot="kit" />
        <div class="spots"></div>
      </div>
    </template>

    <noscript>需要启用 JavaScript，才能进入《粟牙》。</noscript>
    <script type="module" src="js/game.js?v=8"></script>
  </body>
</html>
